name: Deploy BioCraft to Google Play Store

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release status (completed = immediate rollout, draft = manual review in console)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      version_code:
        description: 'Custom Version Code (leave empty for auto-increment)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Custom Version Name (e.g. 1.0.1)'
        required: false
        default: ''
        type: string

jobs:
  build-and-deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Licenses & Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platform-tools" || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Ensure Android Assets Directory & Permissions
        run: |
          mkdir -p android/app/src/main/assets/public
          chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compute Build Versioning
        id: versioning
        run: |
          # Calculate auto-incremented versionCode based on GitHub run number
          # Using offset +1 to ensure it is always > 1 (Play Store versionCode must strictly increase)
          DEFAULT_CODE=$(( ${{ github.run_number }} + 1 ))
          
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE="$DEFAULT_CODE"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            V_NAME="${{ inputs.version_name }}"
          else
            V_NAME="1.0.${{ github.run_number }}"
          fi

          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          echo "Building Version Code: $V_CODE, Version Name: $V_NAME"

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/biocraft.jks
            echo "Keystore successfully created at android/app/biocraft.jks"
          else
            echo "::error::Neither KEYSTORE_BASE64 nor ANDROID_KEYSTORE_BASE64 secret is defined in GitHub Secrets! Please add KEYSTORE_BASE64 in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build Android App Bundle (AAB) & APK
        env:
          BUILD_NUMBER: ${{ env.VERSION_CODE }}
          BUILD_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: biocraft.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '8750257510' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key0' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '8750257510' }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }} --no-daemon --stacktrace

      - name: Upload Build Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: BioCraft-Release-${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Verify Service Account Secret
        id: check_playstore_secret
        env:
          PLAYSTORE_JSON: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAYSTORE_JSON" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::warning::PLAY_STORE_JSON_KEY secret is not set! Skipping Play Store deployment. Signed AAB and APK are available in the GitHub Actions build artifacts."
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Google Play Console
        if: steps.check_playstore_secret.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.royals.biocraft
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
